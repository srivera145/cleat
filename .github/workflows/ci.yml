name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        db:
          - { image: 'mariadb:10.11', name: 'MariaDB 10.11' }
          - { image: 'mysql:8.0', name: 'MySQL 8.0' }
          - { image: 'mysql:8.4', name: 'MySQL 8.4' }
    name: PHP ${{ matrix.php }} / ${{ matrix.db.name }}
    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot || mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CLEAT_TEST_DB_HOST: 127.0.0.1
      CLEAT_TEST_DB_PORT: 3306
      CLEAT_TEST_DB_USER: root
      CLEAT_TEST_DB_PASS: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, curl, json
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test
